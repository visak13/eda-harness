[project]
name = "edp-claude"
version = "0.1.0"
description = "eda-base orchestration skeleton: recipe/plan schemas, deterministic next_action FSM, MCP tool surface, IoC port seams (stubbed)."
requires-python = ">=3.12"
dependencies = [
    "edp-contracts==0.1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "mcp>=1.0",
    "reactivex>=4.0",
]

[project.scripts]
edp-claude-mcp = "edp_claude.mcp_server:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "flake8-print>=5",
    # W1 acceptance (tests/test_w1_context_diet.py): a REAL BPE tokenizer to
    # measure get_recipe_digest's packet size (NOT the len//4 proxy). Phoenix
    # has no text-tokenizer endpoint, so tiktoken cl100k_base is the genuine
    # token count (planner ruling on a6, option A).
    "tiktoken>=0.7",
]

[tool.uv.sources]
edp-contracts = { path = "../edp-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "T20"]

[tool.ruff.lint.per-file-ignores]
# scripts/ are operator CLIs — print() IS their interface. The no-print
# (T20) discipline targets services/library code, not standalone tools.
"scripts/*.py" = ["T201"]
