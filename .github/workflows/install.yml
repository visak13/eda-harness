name: install

# S3 (s-870e401942, design §4.4/§4.10): the one-line installers work on a clean machine. Builds the four
# wheels (edp8 + edp_contracts + edp_pool + edp_broker) with SHA256SUMS like a release, then runs
# install.sh (Linux, macOS) or install.ps1 (Windows) in a clean temp HOME/profile and drives the installed
# `heronry`: init (refuses with no harness; Fable notice codex-less) → start → status → start again →
# /v1/health 200 and /ui → a stub seat through the installed pool (S9) → stop, leaving no process. The drills are v8/scripts/drill_install_{posix.sh,windows.ps1}.

on:
  # Called by ci.yml on every push and PR as its install-smoke job (S9); runnable on its own too.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the SPA bundle
        working-directory: v8
        env:
          EDP8_WEB_BASE: /ui/
        run: npm --prefix web ci && npm --prefix web run build
      - name: Build the four wheels + SHA256SUMS
        env:
          EDP8_WEB_AUTOBUILD: "0"
        run: |
          mkdir -p release
          for p in edp-contracts edp-pool edp-broker v8; do uv build --wheel --out-dir release "$p"; done
          cd release && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/

  posix:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: install.sh in a clean HOME, then init/start/status/stop
        run: bash v8/scripts/drill_install_posix.sh release

  windows:
    needs: wheels
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: install.ps1 in a clean profile, then init/start/status/stop
        shell: powershell
        run: .\v8\scripts\drill_install_windows.ps1 -ReleaseDir "$PWD\release"
