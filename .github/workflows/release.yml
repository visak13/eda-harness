name: release

# S9 (s-9648fded35, design-e963c656f5 §4.5, strategyhl-d76b06a3dd §1) and S10 (s-b431082892, owner R8): a `v*` tag
# builds every asset from that one commit and stops at a DRAFT GitHub Release. R3: GitHub Releases only, no PyPI.
#   prepare       validates the tag (v<X.Y.Z> == edp8.__version__ at the commit, CHANGELOG has its section), decides
#                 what this run does, and (dispatch only, not a dry run) creates the tag when it is absent
#   python-dist   SPA, then sdist + wheel of edp-contracts, edp-pool, edp-broker, edp8; manifest guard + PII gate
#   installers    installers.yml: MSI (Windows), arm64 DMG (macOS, lipo in the log), deb (ubuntu:noble), vsix
#   assets        merge, add install.ps1/install.sh pinned to the tag, require the full set, SHA256SUMS +
#                 `sha256sum -c`, PII gate over everything
#   attest        build-provenance attestation for every asset (id-token + attestations write, nothing else)
#   draft         `gh release create --draft --verify-tag` with the CHANGELOG section + generated notes
#   publish       dispatch only, `publish: true`: the draft becomes the public release (`gh release edit --draft=false`)
# A tag PUSH stops at the draft; only the owner publishes it. Admin -> Updates -> "Cut release" (owner only, with a
# confirm dialog) dispatches this workflow: `dry_run` (default true) validates and writes a summary and nothing
# else (no tag, no build, no release: one ubuntu job); `dry_run: false` tags (when the tag is absent), builds and
# drafts; `publish: true` on top publishes. A tag made with GITHUB_TOKEN triggers no other workflow, so a dispatched
# run builds in the same run, never through the push trigger.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, v<X.Y.Z>: must equal v + edp8.__version__ at the dispatched commit (created when absent, unless dry_run)"
        required: true
        type: string
      dry_run:
        description: "Validate only: no tag, no build, no release (a job summary says what a real run would do)"
        required: false
        default: true
        type: boolean
      publish:
        description: "After the draft is built, publish it (ignored while dry_run is on)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # only the "Create the tag" step writes, and only when `plan` says create_tag=true
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) fail "tag '$TAG' is not v<X.Y.Z>" ;;
          esac
          dry=false; publish=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$DRY_RUN" = "true" ] && dry=true
            [ "$PUBLISH" = "true" ] && publish=true
          fi
          want_publish=$publish
          [ "$dry" = "true" ] && publish=false
          # an existing tag wins (a hand-pushed tag, or a rerun); else the dispatched commit is what a real run tags
          have_tag=false
          if git fetch --quiet --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then have_tag=true; fi
          if [ "$have_tag" = "true" ]; then src="refs/tags/$TAG"; else src="HEAD"; fi
          VER=$(git show "$src:v8/src/edp8/__init__.py" | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          echo "tag $TAG, edp8.__version__ $VER at $src"
          [ "$TAG" = "v$VER" ] || fail "tag $TAG does not match edp8.__version__ $VER at $src"
          git show "$src:CHANGELOG.md" | grep -qF "## [$VER]" || fail "CHANGELOG.md has no '## [$VER]' section at $src"
          build=true; create=false
          if [ "$dry" = "true" ]; then
            build=false
          elif [ "$have_tag" = "false" ]; then
            create=true
          fi
          {
            echo "build=$build"
            echo "create_tag=$create"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## release plan for $TAG ($EVENT)"
            echo "- commit: $(git rev-parse "$src^{commit}")"
            echo "- tag exists: $have_tag"
            if [ "$dry" = "true" ]; then
              echo "- DRY RUN: nothing is tagged, built, drafted or published"
              if [ "$have_tag" = "true" ]; then echo "- a real run would build at the existing tag"; else echo "- a real run would create the tag at this commit and build"; fi
              echo "- a real run would draft the release; publish after the draft: $want_publish"
            else
              echo "- create the tag: $create; build and draft: yes; publish: $publish"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the tag
        if: ${{ steps.plan.outputs.create_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --jq '.ref'

  python-dist:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag matches the source version
        run: |
          VER=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' v8/src/edp8/__init__.py)
          echo "tag $TAG, edp8.__version__ $VER"
          test "$TAG" = "v$VER"
      - name: Build the SPA bundle
        working-directory: v8
        env:
          EDP8_WEB_BASE: /ui/
        run: npm --prefix web ci && npm --prefix web run build
      - name: Package the EDP Chat extension (the edp8 wheel carries it)
        working-directory: v8
        run: npm --prefix vscode-ext/edp-code ci && npm --prefix vscode-ext/edp-code run package
      - name: sdist + wheel for the four packages
        env:
          EDP8_WEB_AUTOBUILD: "0"
          EDP8_REQUIRE_VSIX: "1"
        run: for p in edp-contracts edp-pool edp-broker v8; do uv build --out-dir dist "$p"; done
      - name: Manifest guard (no evidence/tests/.data, size ceilings) and PII gate
        env:
          PII_NEEDLES: ${{ secrets.PII_NEEDLES }}
        run: |
          python3 .github/scripts/check_dist.py dist
          python3 .github/scripts/pii_gate.py --dir dist --require-needles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-python
          path: dist/

  installers:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  assets:
    needs: [python-dist, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-python
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: heronry-desktop-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: edp-code-vsix
          path: assets
          merge-multiple: true
      - name: The install scripts, pinned to this tag
        # README's one-liners fetch releases/latest/download/install.{ps1,sh} (adversary R2-E): the release carries
        # both, and each defaults to ITS OWN tag, so an older release's script never drifts to a newer one.
        run: |
          sed 's/^  \[string\]\$Version = "",$/  [string]$Version = "'"$TAG"'",/' install.ps1 > assets/install.ps1
          sed 's/^VERSION=""; RELEASE_URL=""/VERSION="'"$TAG"'"; RELEASE_URL=""/' install.sh > assets/install.sh
          grep -n "^  \[string\]\$Version = \"$TAG\",$" assets/install.ps1
          grep -n "^VERSION=\"$TAG\"; RELEASE_URL=\"\"" assets/install.sh
      - name: Require the full asset set
        working-directory: assets
        run: |
          ls -l
          need() { n=$(ls $1 2>/dev/null | wc -l); echo "$1: $n (need $2)"; [ "$n" -ge "$2" ]; }
          ok=0
          need '*.whl' 4 || ok=1; need '*.tar.gz' 4 || ok=1; need '*.vsix' 1 || ok=1
          need '*.msi' 1 || ok=1; need '*.dmg' 1 || ok=1; need '*.deb' 1 || ok=1
          need 'install.ps1' 1 || ok=1; need 'install.sh' 1 || ok=1
          exit $ok
      - name: SHA256SUMS over every asset, verified
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: PII gate over the release assets
        env:
          PII_NEEDLES: ${{ secrets.PII_NEEDLES }}
        run: python3 .github/scripts/pii_gate.py --dir assets --require-needles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/

  attest:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "assets/*"

  draft:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Release notes from the CHANGELOG section for this tag
        run: |
          VER="${TAG#v}"
          awk -v h="## [$VER]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## [$VER]' section"; exit 1; }
          cat notes.md
      - name: Create the DRAFT release (the owner publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Heronry $TAG" \
            --notes-file notes.md --generate-notes assets/*
          gh release view "$TAG" --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'

  publish:
    needs: [prepare, draft]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft (the owner asked for it in Cut release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq '{draft: .isDraft, url: .url}'
