name: release

# S9 (s-9648fded35, design-e963c656f5 §4.5, strategyhl-d76b06a3dd §1): a `v*` tag builds every asset from that
# one commit and stops at a DRAFT GitHub Release. Only the owner publishes; no seat pushes a tag (R3: GitHub
# Releases only, no PyPI).
#   python-dist   SPA, then sdist + wheel of edp-contracts, edp-pool, edp-broker, edp8; manifest guard + PII gate
#   installers    installers.yml: MSI (Windows), universal2 DMG (macOS, lipo in the log), deb (ubuntu:noble), vsix
#   assets        merge, add install.ps1/install.sh pinned to the tag, require the full set, SHA256SUMS +
#                 `sha256sum -c`, PII gate over everything
#   attest        build-provenance attestation for every asset (id-token + attestations write, nothing else)
#   draft         `gh release create --draft --verify-tag` with the CHANGELOG section + generated notes
# A dry run: Actions → release → Run workflow with an existing tag (on a fork, or delete the draft afterwards).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing v* tag to build a draft release for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  python-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: The tag matches the source version
        run: |
          VER=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' v8/src/edp8/__init__.py)
          echo "tag $TAG, edp8.__version__ $VER"
          test "$TAG" = "v$VER"
      - name: Build the SPA bundle
        working-directory: v8
        env:
          EDP8_WEB_BASE: /ui/
        run: npm --prefix web ci && npm --prefix web run build
      - name: sdist + wheel for the four packages
        env:
          EDP8_WEB_AUTOBUILD: "0"
        run: for p in edp-contracts edp-pool edp-broker v8; do uv build --out-dir dist "$p"; done
      - name: Manifest guard (no evidence/tests/.data, size ceilings) and PII gate
        env:
          PII_NEEDLES: ${{ secrets.PII_NEEDLES }}
        run: |
          python3 .github/scripts/check_dist.py dist
          python3 .github/scripts/pii_gate.py --dir dist --require-needles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-python
          path: dist/

  installers:
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  assets:
    needs: [python-dist, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-python
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: heronry-desktop-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edp-code-vsix
          path: assets
          merge-multiple: true
      - name: The install scripts, pinned to this tag
        # README's one-liners fetch releases/latest/download/install.{ps1,sh} (adversary R2-E): the release carries
        # both, and each defaults to ITS OWN tag, so an older release's script never drifts to a newer one.
        run: |
          sed 's/^  \[string\]\$Version = "",$/  [string]$Version = "'"$TAG"'",/' install.ps1 > assets/install.ps1
          sed 's/^VERSION=""; RELEASE_URL=""/VERSION="'"$TAG"'"; RELEASE_URL=""/' install.sh > assets/install.sh
          grep -n "^  \[string\]\$Version = \"$TAG\",$" assets/install.ps1
          grep -n "^VERSION=\"$TAG\"; RELEASE_URL=\"\"" assets/install.sh
      - name: Require the full asset set
        working-directory: assets
        run: |
          ls -l
          need() { n=$(ls $1 2>/dev/null | wc -l); echo "$1: $n (need $2)"; [ "$n" -ge "$2" ]; }
          ok=0
          need '*.whl' 4 || ok=1; need '*.tar.gz' 4 || ok=1; need '*.vsix' 1 || ok=1
          need '*.msi' 1 || ok=1; need '*.dmg' 1 || ok=1; need '*.deb' 1 || ok=1
          need 'install.ps1' 1 || ok=1; need 'install.sh' 1 || ok=1
          exit $ok
      - name: SHA256SUMS over every asset, verified
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: PII gate over the release assets
        env:
          PII_NEEDLES: ${{ secrets.PII_NEEDLES }}
        run: python3 .github/scripts/pii_gate.py --dir assets --require-needles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/

  attest:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "assets/*"

  draft:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      - name: Release notes from the CHANGELOG section for this tag
        run: |
          VER="${TAG#v}"
          awk -v h="## [$VER]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## [$VER]' section"; exit 1; }
          cat notes.md
      - name: Create the DRAFT release (the owner publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Heronry $TAG" \
            --notes-file notes.md --generate-notes assets/*
          gh release view "$TAG" --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'
