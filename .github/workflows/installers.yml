name: installers

# S8 (s-6dcf78f803, design §4.9, strategyhl-5af811e7bd §3): Heronry Desktop native installers with Briefcase.
# Builds the four wheels of one release (like install.yml), then per OS: briefcase create/build/package
# (Windows .msi per-user, macOS universal2 .dmg, Linux .deb for ubuntu:noble), unsigned (--adhoc-sign, R10),
# and the service re-entry drill on the built bundle (v8/desktop/scripts/drill_bundle_{windows.ps1,posix.sh}):
# init -> start -> every service is the bundle re-entered with --heronry-service <svc> -> /v1/health + /ui ->
# stop, nothing left. The installers are uploaded as run artifacts; tagging a release attaches them.

on:
  push:
    tags: ["v*"]
    paths: ["v8/**", "edp-contracts/**", "edp-pool/**", "edp-broker/**", ".github/workflows/installers.yml"]
  pull_request:
    paths: ["v8/desktop/**", "v8/src/edp8/desktop.py", "v8/src/edp8/launcher.py", "v8/vscode-ext/edp-code/**", ".github/workflows/installers.yml"]
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the SPA bundle
        working-directory: v8
        env:
          EDP8_WEB_BASE: /ui/
        run: npm --prefix web ci && npm --prefix web run build
      - name: Build the four wheels + proxy_tools + SHA256SUMS
        env:
          EDP8_WEB_AUTOBUILD: "0"
        run: |
          mkdir -p wheels
          for p in edp-contracts edp-pool edp-broker v8; do uv build --wheel --out-dir wheels "$p"; done
          # pywebview's proxy_tools ships only an sdist; Briefcase installs binaries only
          uvx --from pip pip wheel --no-deps -w wheels "proxy_tools==0.1.0"
          cd wheels && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/

  windows:
    needs: wheels
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels
      - name: Build the MSI
        shell: powershell
        run: .\v8\desktop\scripts\build_windows.ps1 -Wheels "$PWD\wheels"
      - name: Service re-entry drill on the built bundle
        shell: powershell
        run: .\v8\desktop\scripts\drill_bundle_windows.ps1 -AppDir "$PWD\v8\desktop\build\heronry\windows\app\src"
      - uses: actions/upload-artifact@v4
        with:
          name: heronry-desktop-windows-msi
          path: v8/desktop/dist/*.msi

  macos:
    needs: wheels
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: v8/desktop/wheels
      - name: Build the universal2 DMG
        working-directory: v8/desktop
        run: |
          python -m pip install "briefcase==0.4.5"
          briefcase create macOS --no-input
          briefcase build macOS --no-input
          briefcase package macOS --adhoc-sign --no-input
          ls -l dist
      - name: universal2 check (lipo)
        working-directory: v8/desktop
        run: |
          APP="build/heronry/macos/app/Heronry Desktop.app"
          lipo -archs "$APP/Contents/MacOS/Heronry Desktop"
          find "$APP" -name '*.so' | head -n 20 | while read -r so; do echo "$(lipo -archs "$so") $so"; done
      - name: Service re-entry drill on the built bundle
        run: bash v8/desktop/scripts/drill_bundle_posix.sh "$PWD/v8/desktop/build/heronry/macos/app/Heronry Desktop.app/Contents/MacOS/Heronry Desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: heronry-desktop-macos-dmg
          path: v8/desktop/dist/*.dmg

  linux:
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: v8/desktop/wheels
      - name: Build the ubuntu:noble deb
        working-directory: v8/desktop
        run: |
          python -m pip install "briefcase==0.4.5"
          briefcase create linux system --target ubuntu:noble --no-input
          briefcase build linux system --target ubuntu:noble --no-input
          briefcase package linux system --target ubuntu:noble -p deb --adhoc-sign --no-input
          ls -l dist
      - name: Install the deb, then the service re-entry drill
        run: |
          sudo apt-get update
          sudo apt-get install -y ./v8/desktop/dist/*.deb
          bash v8/desktop/scripts/drill_bundle_posix.sh "$(command -v heronry)"
      - uses: actions/upload-artifact@v4
        with:
          name: heronry-desktop-linux-deb
          path: v8/desktop/dist/*.deb

  vscode:
    # the extension ships beside the installers: its version prompt installs edp-code-<release>.vsix from the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and package the VS Code extension (Apache-2.0)
        working-directory: v8/vscode-ext/edp-code
        run: |
          npm ci
          npm test
          npm run package
          REL=$(node -p "require('./package.json').heronry.release")
          mv edp-code.vsix "edp-code-$REL.vsix"
          unzip -l "edp-code-$REL.vsix" | grep -i license
      - uses: actions/upload-artifact@v4
        with:
          name: edp-code-vsix
          path: v8/vscode-ext/edp-code/edp-code-*.vsix
