name: installers

# S8 (s-6dcf78f803, design §4.9, strategyhl-5af811e7bd §3): Heronry Desktop native installers with Briefcase.
# Builds the four wheels of one release (like install.yml), then per OS: briefcase create/build/package
# (Windows .msi per-user, macOS arm64 .dmg, Linux .deb built natively on ubuntu-24.04 = noble), unsigned (--adhoc-sign, R10),
# and the service re-entry drill on the built bundle (v8/desktop/scripts/drill_bundle_{windows.ps1,posix.sh}):
# init -> start -> every service is the bundle re-entered with --heronry-service <svc> -> /v1/health + /ui ->
# stop, nothing left. The installers are uploaded as run artifacts; release.yml calls this workflow on a `v*`
# tag (S9) and attaches them to the draft release.

on:
  workflow_call:
    inputs:
      ref:
        description: "The git ref (release tag) to build"
        type: string
        required: false
        default: ""
  pull_request:
    paths: ["v8/desktop/**", "v8/src/edp8/desktop.py", "v8/src/edp8/launcher.py", "v8/vscode-ext/edp-code/**", ".github/workflows/installers.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build the SPA bundle
        working-directory: v8
        env:
          EDP8_WEB_BASE: /ui/
        run: npm --prefix web ci && npm --prefix web run build
      - name: Build the four wheels + proxy_tools + SHA256SUMS
        env:
          EDP8_WEB_AUTOBUILD: "0"
        run: |
          mkdir -p wheels
          for p in edp-contracts edp-pool edp-broker v8; do uv build --wheel --out-dir wheels "$p"; done
          # pywebview's proxy_tools ships only an sdist; Briefcase installs binaries only
          uvx --from pip pip wheel --no-deps -w wheels "proxy_tools==0.1.0"
          cd wheels && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels
          path: wheels/

  windows:
    needs: wheels
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels
          path: wheels
      - name: Build the MSI
        shell: powershell
        run: .\v8\desktop\scripts\build_windows.ps1 -Wheels "$PWD\wheels"
      - name: Service re-entry drill on the built bundle
        shell: powershell
        run: .\v8\desktop\scripts\drill_bundle_windows.ps1 -AppDir "$PWD\v8\desktop\build\heronry\windows\app\src"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heronry-desktop-windows-msi
          path: v8/desktop/dist/*.msi

  macos:
    needs: wheels
    runs-on: macos-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels
          path: v8/desktop/wheels
      - name: Build the arm64 DMG
        working-directory: v8/desktop
        run: |
          python -m pip install "briefcase==0.4.5"
          briefcase create macOS --no-input
          briefcase build macOS --no-input
          briefcase package macOS --adhoc-sign --no-input
          ls -l dist
      - name: arm64 check (lipo)
        working-directory: v8/desktop
        run: |
          APP="build/heronry/macos/app/Heronry Desktop.app"
          # arm64 only (desktop/pyproject.toml: cryptography has no x86_64 macOS wheel since 49.0.0)
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Heronry Desktop")"; echo "$ARCHS"
          case " $ARCHS " in *" arm64 "*) ;; *) echo "the app binary has no arm64 slice"; exit 1 ;; esac
          find "$APP" -name '*.so' | head -n 20 | while read -r so; do echo "$(lipo -archs "$so") $so"; done
      - name: Service re-entry drill on the built bundle
        run: bash v8/desktop/scripts/drill_bundle_posix.sh "$PWD/v8/desktop/build/heronry/macos/app/Heronry Desktop.app/Contents/MacOS/Heronry Desktop"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heronry-desktop-macos-dmg
          path: v8/desktop/dist/*.dmg

  linux:
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # no setup-python here: a native linux-system build must run briefcase under the distro's python3, which
      # the deb bundles against (run 36332807759: "3.12.14 ... is not the system python3 ('3.12.3')")
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels
          path: v8/desktop/wheels
      - name: Build the ubuntu:noble deb (natively)
        working-directory: v8/desktop
        # native, not --target ubuntu:noble: briefcase's Docker build mounts only the bundle dir, so the host
        # ./wheels find-links was "a non-existing path" in the container (release run 36332234433). The runner
        # IS noble, so the native deb targets the same system; its build packages come from apt here.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv libgirepository1.0-dev libcairo2-dev pkg-config
          /usr/bin/python3 -m venv .bvenv
          .bvenv/bin/python -m pip install "briefcase==0.4.5"
          .bvenv/bin/briefcase create linux system --no-input
          .bvenv/bin/briefcase build linux system --no-input
          .bvenv/bin/briefcase package linux system -p deb --adhoc-sign --no-input
          ls -l dist
      - name: Install the deb, then the service re-entry drill
        run: |
          sudo apt-get update
          sudo apt-get install -y ./v8/desktop/dist/*.deb
          bash v8/desktop/scripts/drill_bundle_posix.sh "$(command -v heronry)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heronry-desktop-linux-deb
          path: v8/desktop/dist/*.deb

  vscode:
    # the extension ships beside the installers: its version prompt installs edp-code-<release>.vsix from the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test and package the VS Code extension (Apache-2.0)
        working-directory: v8/vscode-ext/edp-code
        run: |
          npm ci
          npm test
          npm run package
          REL=$(node -p "require('./package.json').heronry.release")
          mv edp-code.vsix "edp-code-$REL.vsix"
          unzip -l "edp-code-$REL.vsix" | grep -i license
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edp-code-vsix
          path: v8/vscode-ext/edp-code/edp-code-*.vsix
