[project]
name = "edp-integration"
version = "0.1.0"
description = "Cross-component integration tests for eda-base (milestone #9). Depends on all built components via path."
requires-python = ">=3.12"
dependencies = [
    "edp-contracts==0.1.0",
    "edp-claude==0.1.0",
    "edp-broker==0.1.0",
    "edp-pool==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.uv.sources]
edp-contracts = { path = "../edp-contracts", editable = true }
edp-claude = { path = "../claude", editable = true }
edp-broker = { path = "../edp-broker", editable = true }
edp-pool = { path = "../edp-pool", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
