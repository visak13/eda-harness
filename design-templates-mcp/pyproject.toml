[project]
name = "design-templates-mcp"
version = "0.1.0"
description = "Standalone MCP server that serves eda-designs design templates (themes, components, scaffolds, docs) read-only, live from disk. Code lives in eda-base3; content is read from eda-designs and never copied."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "mcp>=1.0",
]

[project.scripts]
design-templates-mcp = "design_templates_mcp.server:run"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_templates_mcp"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "T20"]

[tool.ruff.lint.per-file-ignores]
# scripts/ are operator CLIs — print() IS their interface (mirrors edp-claude).
"scripts/*.py" = ["T201"]
