<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>edp8 board</title>
    <!-- No icon file yet: an empty data URL keeps browsers from requesting /favicon.ico (a 404 in every console). -->
    <link rel="icon" href="data:," />
    <!--
      Pre-paint theme: runs before the bundle so <html data-theme> is set before first
      paint (no FOUC). NO imports allowed here. This MUST mirror resolveTheme() in
      src/theme/resolve.ts: stored choice wins; else prefers-contrast:more → folio-hc;
      else prefers-color-scheme:dark → ember; else folio. Cite: MDN prefers-color-scheme.
    -->
    <script>
      try {
        var t = localStorage.getItem("edp8.theme");
        if (!["folio", "dusk", "ember", "folio-hc", "sage", "slate", "midnight", "obsidian"].includes(t)) {
          t = matchMedia("(prefers-contrast: more)").matches
            ? "folio-hc"
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "ember"
              : "folio";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "folio";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
