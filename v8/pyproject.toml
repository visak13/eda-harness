[project]
name = "edp8"
version = "0.8.0"
description = "v8 orchestration board: ten objects, guards, feed, role-scoped MCP bundles."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "sse-starlette>=2.1",
    "numpy>=1.26",
    "markdown>=3.6",
    "nh3>=0.2",
    "pillow>=10.0",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
embed = ["fastembed>=0.3"]

[project.scripts]
edp8 = "edp8.cli:main"
edp8-board = "edp8.service:run"
edp8-mcp = "edp8.mcp_server:run"
edp8-feed = "edp8.feed_driver:run"
edp8-supervisor = "edp8.supervisor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp8"]
# force-include is the SOLE source of dist. Exclude it from the standard file selection so a
# non-VCS build (e.g. inside Docker, where .git is absent and hatch would otherwise include
# every file under the package) does not add dist a second time and collide with force-include.
exclude = ["src/edp8/webapp/dist"]

# The Vite SPA build output is gitignored (src/edp8/webapp/dist) but MUST ship in the
# wheel — hatch's VCS file selection skips gitignored paths, so force-include re-adds it.
# Proven in S1: `uv build --wheel` then listing the wheel shows edp8/webapp/dist/index.html.
[tool.hatch.build.targets.wheel.force-include]
"src/edp8/webapp/dist" = "edp8/webapp/dist"

# The wheel refuses (or, with npm on PATH, rebuilds) a SPA bundle older than web/src — a stale dist
# shipped silently otherwise (qa acceptance finding #15, 2026-09-10). See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# `uv build` (no flag) builds the sdist first, then the wheel FROM that sdist. hatch's sdist honours
# .gitignore, so without this the gitignored dist never enters the tarball and the wheel stage dies
# with "Forced include not found: …/src/edp8/webapp/dist". Carry dist into the sdist so the built
# SPA survives the sdist→wheel round-trip. (qa cold run 2026-09-08; c-f54afda4db.)
[tool.hatch.build.targets.sdist]
artifacts = ["src/edp8/webapp/dist/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 132
target-version = "py312"
src = ["src"]
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E741"]
# ui.py is the legacy server-rendered renderer. It is RETAINED through G4 (s-edb266895d): the
# retirement moved to a follow-up epic (ruling m-a180f62f3b), so this file is not deleted here. Its
# terse one-line-per-branch style trips E701/E702; not worth reflowing a file pending retirement.
"src/edp8/ui.py" = ["E501", "E701", "E702", "E402", "E741"]
