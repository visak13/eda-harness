[project]
name = "edp8"
version = "0.8.0"
description = "v8 orchestration board: ten objects, guards, feed, role-scoped MCP bundles."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "sse-starlette>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
embed = ["fastembed>=0.3"]

[project.scripts]
edp8-board = "edp8.service:run"
edp8-mcp = "edp8.mcp_server:run"
edp8-feed = "edp8.feed_driver:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 132
target-version = "py312"
src = ["src"]
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E741"]
"src/edp8/ui.py" = ["E501"]
