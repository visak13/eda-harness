<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" font-family="system-ui,Segoe UI,sans-serif" font-size="11" role="img" aria-label="Your phone, a laptop and a teammate reach this board over your private tailnet">
<title>What Remote access is for</title><rect width="320" height="150" rx="10" style="fill:var(--bg,#F8F1E8)"/>
<rect x="118" y="36" width="84" height="62" rx="8" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/>
<text x="160" y="62" text-anchor="middle" font-weight="600" style="fill:var(--ink,#30231E)">this computer</text>
<text x="160" y="78" text-anchor="middle" style="fill:var(--accentink,#9B4734)">Heronry board</text>
<rect x="14" y="20" width="30" height="46" rx="5" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/><text x="29" y="82" text-anchor="middle" style="fill:var(--ink,#30231E)">your phone</text>
<rect x="8" y="98" width="46" height="28" rx="3" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/><text x="31" y="140" text-anchor="middle" style="fill:var(--ink,#30231E)">your laptop</text>
<circle cx="282" cy="52" r="14" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/><path d="M262 92q20-22 40 0" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/><text x="282" y="110" text-anchor="middle" style="fill:var(--ink,#30231E)">a teammate</text>
<path d="M48 44 116 58M58 110 116 86M266 66 204 70" stroke-width="2" stroke-dasharray="5 4" fill="none" style="stroke:var(--accentink,#9B4734)"/>
<text x="160" y="128" text-anchor="middle" style="fill:var(--ink,#30231E)">- - -  your private tailnet (Tailscale)</text>
</svg>
