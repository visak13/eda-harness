<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" font-family="system-ui,Segoe UI,sans-serif" font-size="11" role="img" aria-label="Download Tailscale for Windows, macOS or Linux and install it on this computer">
<title>Install Tailscale</title><rect width="320" height="150" rx="10" style="fill:var(--bg,#F8F1E8)"/>
<rect x="30" y="30" width="120" height="80" rx="8" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/>
<text x="90" y="54" text-anchor="middle" font-weight="600" style="fill:var(--ink,#30231E)">tailscale.com/download</text>
<path d="M90 64v26m-10-10 10 10 10-10" stroke-width="2.5" fill="none" stroke-linecap="round" style="stroke:var(--accentink,#9B4734)"/>
<path d="M160 70h40m-8-8 8 8-8 8" stroke-width="1.5" fill="none" style="stroke:var(--ink,#30231E)"/>
<rect x="210" y="30" width="90" height="80" rx="8" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/>
<text x="255" y="58" text-anchor="middle" style="fill:var(--ink,#30231E)">Windows</text><text x="255" y="76" text-anchor="middle" style="fill:var(--ink,#30231E)">macOS</text><text x="255" y="94" text-anchor="middle" style="fill:var(--ink,#30231E)">Linux</text>
<text x="160" y="134" text-anchor="middle" style="fill:var(--ink,#30231E)">Install it on THIS computer (the one running the board).</text>
</svg>
