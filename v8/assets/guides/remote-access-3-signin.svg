<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" font-family="system-ui,Segoe UI,sans-serif" font-size="11" role="img" aria-label="Sign in to Tailscale; this page then reads tailscale status and shows Running">
<title>Sign in to Tailscale</title><rect width="320" height="150" rx="10" style="fill:var(--bg,#F8F1E8)"/>
<rect x="24" y="24" width="140" height="92" rx="8" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/>
<text x="94" y="46" text-anchor="middle" font-weight="600" style="fill:var(--ink,#30231E)">Tailscale</text>
<rect x="46" y="60" width="96" height="24" rx="12" style="fill:var(--accentink,#9B4734)"/><text x="94" y="76" text-anchor="middle" style="fill:var(--panel,#FFF9F2)">Log in</text>
<text x="94" y="104" text-anchor="middle" style="fill:var(--ink,#30231E)">or: tailscale up</text>
<path d="M172 70h30m-8-8 8 8-8 8" stroke-width="1.5" fill="none" style="stroke:var(--ink,#30231E)"/>
<rect x="210" y="40" width="96" height="60" rx="8" stroke-width="2" style="fill:var(--panel,#FFF9F2);stroke:var(--accentink,#9B4734)"/>
<text x="258" y="64" text-anchor="middle" style="fill:var(--ink,#30231E)">status</text><text x="258" y="84" text-anchor="middle" font-weight="600" style="fill:var(--accentink,#9B4734)">Running</text>
<text x="160" y="138" text-anchor="middle" style="fill:var(--ink,#30231E)">Use any Google, Microsoft, GitHub or Apple account.</text>
</svg>
