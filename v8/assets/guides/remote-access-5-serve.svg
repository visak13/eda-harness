<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" font-family="system-ui,Segoe UI,sans-serif" font-size="11" role="img" aria-label="tailscale serve publishes https://your-machine.ts.net on the tailnet and forwards to the board on 127.0.0.1">
<title>Serve on your tailnet</title><rect width="320" height="150" rx="10" fill="#F8F1E8"/>
<rect x="14" y="44" width="130" height="50" rx="8" fill="#FFF9F2" stroke="#9B4734" stroke-width="2"/>
<text x="79" y="66" text-anchor="middle" fill="#9B4734" font-weight="600">https://</text><text x="79" y="82" text-anchor="middle" fill="#30231E">your-pc.ts.net</text>
<path d="M148 69h40m-8-8 8 8-8 8" stroke="#30231E" stroke-width="1.5" fill="none"/>
<text x="168" y="58" text-anchor="middle" fill="#30231E" font-size="9">serve</text>
<rect x="194" y="44" width="112" height="50" rx="8" fill="#FFF9F2" stroke="#30231E" stroke-width="1.5"/>
<text x="250" y="66" text-anchor="middle" fill="#30231E" font-weight="600">board</text><text x="250" y="82" text-anchor="middle" fill="#30231E">127.0.0.1</text>
<text x="160" y="122" text-anchor="middle" fill="#30231E">Only devices on your tailnet can open it,</text><text x="160" y="138" text-anchor="middle" fill="#30231E">and every request needs a token.</text>
</svg>
