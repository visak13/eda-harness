<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" font-family="system-ui,Segoe UI,sans-serif" font-size="11" role="img" aria-label="tailscale serve publishes https://your-machine.ts.net on the tailnet and forwards to the board on 127.0.0.1">
<title>Serve on your tailnet</title><rect width="320" height="150" rx="10" style="fill:var(--bg,#F8F1E8)"/>
<rect x="14" y="44" width="130" height="50" rx="8" stroke-width="2" style="fill:var(--panel,#FFF9F2);stroke:var(--accentink,#9B4734)"/>
<text x="79" y="66" text-anchor="middle" font-weight="600" style="fill:var(--accentink,#9B4734)">https://</text><text x="79" y="82" text-anchor="middle" style="fill:var(--ink,#30231E)">your-pc.ts.net</text>
<path d="M148 69h40m-8-8 8 8-8 8" stroke-width="1.5" fill="none" style="stroke:var(--ink,#30231E)"/>
<text x="168" y="58" text-anchor="middle" font-size="9" style="fill:var(--ink,#30231E)">serve</text>
<rect x="194" y="44" width="112" height="50" rx="8" stroke-width="1.5" style="fill:var(--panel,#FFF9F2);stroke:var(--ink,#30231E)"/>
<text x="250" y="66" text-anchor="middle" font-weight="600" style="fill:var(--ink,#30231E)">board</text><text x="250" y="82" text-anchor="middle" style="fill:var(--ink,#30231E)">127.0.0.1</text>
<text x="160" y="122" text-anchor="middle" style="fill:var(--ink,#30231E)">Only devices on your tailnet can open it,</text><text x="160" y="138" text-anchor="middle" style="fill:var(--ink,#30231E)">and every request needs a token.</text>
</svg>
