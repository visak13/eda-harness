# Secret + PII gate (S9, design §4.5; strategyhl-d76b06a3dd §4).
# CI runs `gitleaks dir .` (the tree) and `gitleaks git --log-opts=<base>..<head>` (new commits);
# both block. The default ruleset finds credentials; the rule below finds a checkout path.
# The maintainer's username, email and name are NOT in this file (qa report-bcef24a36a: a needle
# in a tracked file publishes it, character class or not). They live in the PII_NEEDLES secret
# (CI) or the gitignored .pii-needles.toml (the maintainer's machine); CI runs gitleaks on
# `.gitleaks.pii.toml`, which `.github/scripts/pii_gate.py --gitleaks-config` writes: it extends
# this file with the owner rules. No path is exempt from them: NOTICE names "Heronry
# contributors" (owner m-c486b47c54).

title = "heronry secret + PII gate"

[extend]
useDefault = true

[[rules]]
id = "pii-projects-root"
description = "The maintainer's checkout root: a Projects folder at a drive root (Windows or Git Bash form)"
regex = '''(?i)(?:\b[a-z]:(?:\\\\|\\|/)+|/[a-z]/|/[a-z]:/)projects(?:\\|/|$)'''

# Test fixtures that look like tokens. Scoped: the path AND the fixture shape must both match,
# and only the generic-api-key rule is relaxed. None of these is a live credential
# (checked against tokens.json and human-tokens.txt on 2026-09-27: 0 of 88 appear in the tree).
[[allowlists]]
description = "token-shaped test fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^v8/tests/test_[a-z0-9_]+\.py$''',
  '''^v8/web/e2e/[a-z0-9-]+\.spec\.ts$''',
  '''^v8/vscode-ext/edp-code/test/[a-zA-Z0-9]+\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^tok-SECRET-[0-9a-z]+$''',
  '''^[a-z]{1,2}[0-9]{1,3}-(owner|seat|stranger)-tok-[0-9a-f]{10}$''',
  '''^PlantedTok3n-[A-Za-z0-9]+$''',
  '''^Zq8Wv3Ln5Tr2Kp7Xs9Dy4Hb6Gm1Jc0Fa$''',
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
]

# A doc line that reads like `KEY=value` but is an env assignment, not a secret.
[[allowlists]]
description = "env assignment in the Astra seat guide"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^v8/guides/astra-seat\.md$''']
regexTarget = "secret"
regexes = ['''^EDP_HARNESS=pi$''']
