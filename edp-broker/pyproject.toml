[project]
name = "edp-broker"
version = "0.1.0"
description = "Dumb durable message bus for eda-base. One BrokerMessage envelope; append-only per-recipient JSONL; replay-on-reconnect."
requires-python = ">=3.12"
dependencies = [
    "edp-contracts==0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
edp-broker = "edp_broker.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "flake8-print>=5",
]

[tool.uv.sources]
edp-contracts = { path = "../edp-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_broker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "T20"]
