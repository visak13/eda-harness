[project]
name = "edp-contracts"
version = "0.1.0"
description = "Shared base contracts for the eda-base system: Microservice/Tool ABCs, envelopes, broker message, skill validator, structured logging. Dependency-light (pydantic + stdlib only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Consumers that call mount() also need FastAPI; it is intentionally NOT a
# hard dependency so importers like claude/ stay light (HLD §2.2).
service = [
    "fastapi>=0.110",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "flake8-print>=5",
    # test-only (NOT package deps): exercise mount()/contract tests.
    "fastapi>=0.110",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_contracts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# flake8-print (T20) enforces the no-print() rule from LLD §6 / TESTPLAN ST-3.
select = ["E", "F", "I", "T20"]
