[project]
name = "edp-pool"
version = "0.1.0"
description = "Spawn-on-demand shell pool for eda-base. Lock-by-spawn-lifetime; env-capped capacity (EDP_MAX_WORKERS/PLANNERS/TOTAL_SHELLS); park/fork-resume; registers relative-ref aliases into the broker."
requires-python = ">=3.12"
dependencies = [
    "edp-contracts==0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "psutil>=5.9",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
edp-pool = "edp_pool.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "flake8-print>=5",
]

[tool.uv.sources]
edp-contracts = { path = "../edp-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_pool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "T20"]
